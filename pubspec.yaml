name: innovare_side_menu
description: A beautiful, highly customizable side menu widget for Flutter with expanded/collapsed modes, badges, permission filtering, and 5 built-in themes.
version: 1.1.0
homepage: https://github.com/innovare-tech/innovare_side_menu
repository: https://github.com/innovare-tech/innovare_side_menu
issue_tracker: https://github.com/innovare-tech/innovare_side_menu/issues

topics:
  - side-menu
  - navigation
  - sidebar
  - widget
  - ui

platforms:
  android:
  ios:
  web:
  macos:
  windows:
  linux:

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  innovare_design: ^0.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# innovare_design is part of this monorepo and not yet on pub.dev. The override
# resolves it locally during development; once published, drop this section and
# the hosted constraint above takes over.
dependency_overrides:
  innovare_design:
    path: ../innovare_design
